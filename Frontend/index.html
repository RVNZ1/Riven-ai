<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riven AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">R</div>

                <div>
                    <h2>Riven</h2>
                    <span>AI Assistant</span>
                </div>
            </div>

            <button class="new-chat" onclick="newChat()">
                ＋ Chat Baru
            </button>

            <div class="menu-title">
                MODE
            </div>

            <button class="mode active" onclick="setMode('general', this)">
                📚 Semua Pelajaran
            </button>

            <button class="mode" onclick="setMode('coding', this)">
                💻 Coding
            </button>

            <button class="mode" onclick="setMode('math', this)">
                🧮 Matematika
            </button>

            <button class="mode" onclick="setMode('science', this)">
                🔬 Sains
            </button>

            <div class="sidebar-bottom">
                <span>Riven AI v1.0</span>
            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <header class="topbar">

                <button class="mobile-menu" onclick="toggleSidebar()">
                    ☰
                </button>

                <div>
                    <h3 id="modeTitle">Riven AI</h3>
                    <span>Teman belajar kamu</span>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

            </header>


            <!-- CHAT -->
            <section class="chat" id="chat">

                <div class="welcome">

                    <div class="big-logo">
                        R
                    </div>

                    <h1>Halo, aku Riven 👋</h1>

                    <p>
                        Aku bisa membantu kamu belajar, mengerjakan soal,
                        memahami materi, dan terutama membantu coding.
                    </p>

                    <div class="suggestions">

                        <button onclick="useSuggestion('Jelaskan integral dengan cara yang mudah dipahami')">
                            🧮 Belajar Matematika
                        </button>

                        <button onclick="useSuggestion('Bantu aku belajar HTML dan CSS dari dasar')">
                            💻 Belajar Coding
                        </button>

                        <button onclick="useSuggestion('Jelaskan hukum Newton dengan contoh sederhana')">
                            🔬 Belajar Fisika
                        </button>

                        <button onclick="useSuggestion('Buatkan rangkuman materi sejarah untuk SMA')">
                            📚 Rangkuman Pelajaran
                        </button>

                    </div>

                </div>

            </section>


            <!-- INPUT -->
            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Tanya apa saja ke Riven..."
                        rows="1"
                        onkeydown="handleEnter(event)"
                    ></textarea>

                    <button
                        class="send"
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    Riven dapat melakukan kesalahan. Selalu periksa jawaban penting.
                </p>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
  </html>
